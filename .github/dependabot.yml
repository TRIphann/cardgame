# Dependabot config for Arcana — Card Battle.
#
# Dependabot opens PRs for outdated dependencies weekly. We group minor
# + patch updates per-package to keep the PR stream manageable, and let
# major upgrades (which often need a code change) open individually so
# we can review them in isolation.
#
# Why weekly and not daily?
#   - GitHub limits free Dependabot runs; weekly keeps us under the cap.
#   - .NET + npm packages churn a lot — daily would generate noise.
#   - Renovate would be another option but Dependabot is built-in.

version: 2

updates:
  # ── NuGet (backend) ────────────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
        update-types:
          - "minor"
          - "patch"
      firestore:
        patterns:
          - "Google.Cloud.Firestore.*"
        update-types:
          - "minor"
          - "patch"
      signalr:
        patterns:
          - "Microsoft.AspNetCore.SignalR.*"
          - "Microsoft.AspNetCore.SignalR.Common.*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"
    reviewers:
      - "gmae-backend-team"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── npm (frontend) ────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    # @vitejs/plugin-react 6.x requires Vite 8 as a peer dep, but this repo
    # pins Vite 5 — Dependabot's 4.x→6.x PR ships a lockfile npm cannot
    # resolve (`edgesOut` crash), which breaks every Netlify build until the
    # PR is closed. Hold the plugin on v4 until the Vite 8 upgrade is planned.
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
        update-types:
          - "minor"
          - "patch"
      build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "esbuild"
        update-types:
          - "minor"
          - "patch"
      e2e:
        patterns:
          - "@playwright/test"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── GitHub Actions ───────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"