name: Deploy Backend (Render)

# Triggers a Render deploy via the deploy-hook URL.
#
# Render has its own auto-deploy from `main` (see render.yaml's autoDeploy).
# This workflow is the manual fallback + the audit trail for releases:
#   - Releases (`v*.*.*` tags) trigger a production deploy with a pinned
#     commit hash. Render records which SHA is currently live.
#   - workflow_dispatch lets ops re-trigger a deploy without a new push.
#
# Note: Render does NOT host a separate staging environment in this
# project (single Web Service on Starter plan). If you add a staging
# service later, duplicate the job below with a different secret name
# (RENDER_DEPLOY_HOOK_URL_STAGING).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you triggering this deploy?'
        required: false
        type: string
        default: 'manual re-deploy'

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false  # Backend deploys are serial — never cancel.

permissions:
  contents: read
  deployments: write

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # VALIDATE
  # ───────────────────────────────────────────────────────────────────────
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify the render.yaml blueprint
        # Cheap schema check so a typo in render.yaml doesn't break Render.
        run: |
          python3 - <<'PY'
          import sys, yaml
          try:
              with open('render.yaml') as f:
                  doc = yaml.safe_load(f)
              assert 'services' in doc, "render.yaml missing 'services'"
              assert any(s.get('name') == 'arcana-api' for s in doc['services']), "Missing arcana-api service"
              print("✅ render.yaml blueprint is valid.")
          except Exception as e:
              print(f"::error::{e}")
              sys.exit(1)
          PY

      - name: Verify backend builds (no publish — saves runner time)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet build
        working-directory: backend
        run: |
          dotnet restore Arcana.sln
          dotnet build Arcana.sln -c Release --no-restore --no-incremental

  # ───────────────────────────────────────────────────────────────────────
  # TRIGGER RENDER DEPLOY
  # ───────────────────────────────────────────────────────────────────────
  trigger-render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 10
    steps:
      - name: Hit Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          REASON: ${{ github.event.inputs.reason || format('GitHub Actions — ref={0} event={1} sha={2}', github.ref, github.event_name, github.sha) }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing. See .github/workflows/deploy-backend.yml header for setup instructions."
            exit 1
          fi
          echo "Triggering Render deploy — reason: $REASON"
          # Render's deploy hooks accept plain GET or POST and ignore the body.
          # We POST so we can attach metadata; Render just queues a deploy.
          HTTP_CODE=$(curl -sS -o /tmp/render-response.json -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions-deploy-backend" \
            --data "$(jq -n --arg reason "$REASON" --arg sha "${{ github.sha }}" '{reason: $reason, sha: $sha}')")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Render accepted deploy (HTTP $HTTP_CODE)"
            cat /tmp/render-response.json
          else
            echo "::error::Render rejected deploy (HTTP $HTTP_CODE)"
            cat /tmp/render-response.json
            exit 1
          fi

      - name: Wait for Render to come back up
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        # Render typically takes 60-180s to redeploy. We poll the live
        # /health endpoint every 10s for up to 5 minutes.
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Skipping wait — RENDER_API_KEY or RENDER_SERVICE_ID not set."
            exit 0
          fi
          DEPLOY_URL="${{ vars.PRODUCTION_API_BASE_URL || 'https://cardgame-lwsk.onrender.com' }}"
          echo "Waiting for $DEPLOY_URL/health to come back up..."
          for i in $(seq 1 30); do
            HTTP=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$DEPLOY_URL/health" || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Backend is healthy again after $((i * 10))s"
              cat /tmp/health.json
              exit 0
            fi
            echo "[$i/30] HTTP=$HTTP (still deploying or cold-starting)"
            sleep 10
          done
          echo "::error::Backend didn't come back up after 5 min."
          echo "Check Render dashboard: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
          exit 1

      - name: Create GitHub deployment record
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: chrnorm/deployment-action@v2
        env:
          DEPLOY_URL: ${{ vars.PRODUCTION_API_BASE_URL || 'https://cardgame-lwsk.onrender.com' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: "Backend deployed — Render build triggered from ${{ github.event_name }}"
          log-url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Mark release as deployed
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.event.release.tag_name }}" \
            --notes "$(gh release view "${{ github.event.release.tag_name }}" --json notes -q .notes)

      - name: Rollback on failure
        if: failure()
        # Render keeps the previous deploy online until the new build's
        # health check passes. So "rollback" is just disabling auto-deploy
        # via the API and re-pinning to the previous SHA.
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not set — manual rollback required."
            exit 0
          fi
          PREV_SHA=$(curl -sS "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=2" \
            -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.[1].commit.id // "unknown"')
          echo "Previous SHA was $PREV_SHA. Reverting autoDeploy branch to it via Render API."
          curl -sS -X PATCH "https://api.render.com/v1/services/$RENDER_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"autoDeploy\": false}" || true