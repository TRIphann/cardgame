[build]
  publish = "frontend/dist"
  command = "cd frontend && npm ci && npm run build"

# SPA fallback — React Router handles client-side routes. Anything not under
# /assets or with a file extension falls back to /index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache busting — short TTL on the index, long on hashed asset bundles.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"