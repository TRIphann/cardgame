[build]
  publish = "frontend/src"
  command = "echo 'Static site, no build needed'"

[[redirects]]
  from = "/"
  to = "/pages/landing/index.html"
  status = 302

[[redirects]]
  from = "/lobby"
  to = "/pages/lobby/index.html"
  status = 302

[[redirects]]
  from = "/room-entry"
  to = "/pages/room-entry/index.html"
  status = 302

# Cache busting — short TTL on HTML, long on assets
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"