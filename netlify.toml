[build]
  publish = "frontend/src"
  command = "echo 'Static site, no build needed'"

[[redirects]]
  from = "/"
  to = "/games/exploding-cats/pages/landing/index.html"
  status = 302

[[redirects]]
  from = "/lobby"
  to = "/games/exploding-cats/pages/lobby/index.html"
  status = 302

[[redirects]]
  from = "/room-entry"
  to = "/games/exploding-cats/pages/room-entry/index.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
