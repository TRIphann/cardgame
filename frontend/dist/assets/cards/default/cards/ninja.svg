<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
<defs>
  <linearGradient id="bg_ninja1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdfdfd"/><stop offset="100%" stop-color="#dde0e8"/></linearGradient>
  <linearGradient id="ov_ninja1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="black" stop-opacity="0"/><stop offset="100%" stop-color="black" stop-opacity="0.18"/></linearGradient>
  <filter id="sd_ninja1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.4"/></filter>
  <radialGradient id="bgGlow_ninja1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#222244" stop-opacity="0.18"/><stop offset="60%" stop-color="#222244" stop-opacity="0.05"/><stop offset="100%" stop-color="#222244" stop-opacity="0"/></radialGradient>
</defs>
<g filter="url(#sd_ninja1)"><rect width="140" height="200" rx="14" fill="url(#bg_ninja1)"/></g>
<rect x="1.5" y="1.5" width="137" height="197" rx="13" fill="none" stroke="#1a1a1a" stroke-width="0.8" opacity="0.22"/>
<rect width="140" height="200" rx="14" fill="url(#bgGlow_ninja1)"/>
<rect x="0" y="146" width="140" height="54" fill="url(#ov_ninja1)"/>

<!-- Speed lines background -->
<g opacity="0.12">
  <line x1="14" y1="40" x2="38" y2="48" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="10" y1="60" x2="34" y2="62" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="14" y1="84" x2="36" y2="84" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="46" x2="128" y2="40" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="108" y1="62" x2="130" y2="60" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="84" x2="128" y2="84" stroke="#1a1a1a" stroke-width="1.5"/>
</g>

<g transform="translate(0,4)" opacity="0.97">
<g transform="translate(0,4)">
  <!-- Head (full ninja hood) -->
  <path d="M44 40 Q44 28 70 24 Q96 28 96 40 L96 78 Q96 90 70 92 Q44 90 44 78 Z" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <!-- Hood folds -->
  <path d="M48 36 Q50 30 56 28" stroke="#3a3a3a" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M92 36 Q90 30 84 28" stroke="#3a3a3a" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Face opening -->
  <path d="M52 54 Q70 58 88 54 L88 72 Q70 78 52 72 Z" fill="#d4b896" stroke="#3a2010" stroke-width="1.2"/>
  <!-- Eyes (narrow) -->
  <path d="M58 60 Q62 56 66 60" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M74 60 Q78 56 82 60" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Eye glow red dots -->
  <circle cx="62" cy="60" r="1.2" fill="#cc0000"/>
  <circle cx="78" cy="60" r="1.2" fill="#cc0000"/>
  <!-- Mouth -->
  <line x1="64" y1="70" x2="76" y2="70" stroke="#3a2010" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Headband tie -->
  <path d="M88 50 L106 38 L110 42 L92 56 Z" fill="#cc0000" stroke="#881111" stroke-width="1.2"/>
  <path d="M106 38 L120 32" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 38 L122 36" stroke="#cc0000" stroke-width="3" stroke-linecap="round"/>

  <!-- Body (gi) -->
  <path d="M44 86 L40 130 L100 130 L96 86 Q70 92 44 86 Z" fill="#1a1a1a" stroke="#000" stroke-width="2"/>
  <!-- Gi belt -->
  <rect x="42" y="110" width="56" height="6" fill="#cc0000" stroke="#881111" stroke-width="1"/>
  <!-- Belt knot -->
  <rect x="64" y="114" width="12" height="8" rx="1" fill="#aa0000" stroke="#660000" stroke-width="0.6"/>

  <!-- Arms -->
  <path d="M44 88 L34 124 L42 126 L48 92 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.5"/>
  <path d="M96 88 L106 124 L98 126 L92 92 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.5"/>
  <!-- Hand wraps -->
  <rect x="30" y="124" width="14" height="8" rx="1" fill="#d4b896" stroke="#3a2010" stroke-width="0.8"/>
  <rect x="96" y="124" width="14" height="8" rx="1" fill="#d4b896" stroke="#3a2010" stroke-width="0.8"/>

  <!-- Throwing star in hand -->
  <g transform="translate(34,120)">
    <path d="M0 -8 L1.5 -1.5 L8 0 L1.5 1.5 L0 8 L-1.5 1.5 L-8 0 L-1.5 -1.5 Z" fill="#aaaaaa" stroke="#1a1a1a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="1.2" fill="#1a1a1a"/>
  </g>
</g></g>

<text x="70" y="180" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="14" font-weight="900" fill="#1a1a1a" letter-spacing="1.5">NINJA</text>
</svg>