<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
<defs>
  <linearGradient id="bg_robot1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdfdfd"/><stop offset="100%" stop-color="#dde4ea"/></linearGradient>
  <linearGradient id="ov_robot1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="black" stop-opacity="0"/><stop offset="100%" stop-color="black" stop-opacity="0.18"/></linearGradient>
  <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8eef4"/>
    <stop offset="100%" stop-color="#a8b0b8"/>
  </linearGradient>
  <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f0f4f8"/>
    <stop offset="100%" stop-color="#b8c0c8"/>
  </linearGradient>
  <filter id="sd_robot1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.4"/></filter>
  <radialGradient id="bgGlow_robot1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#5577aa" stop-opacity="0.22"/><stop offset="60%" stop-color="#5577aa" stop-opacity="0.06"/><stop offset="100%" stop-color="#5577aa" stop-opacity="0"/></radialGradient>
</defs>
<g filter="url(#sd_robot1)"><rect width="140" height="200" rx="14" fill="url(#bg_robot1)"/></g>
<rect x="1.5" y="1.5" width="137" height="197" rx="13" fill="none" stroke="#334466" stroke-width="0.8" opacity="0.22"/>
<rect width="140" height="200" rx="14" fill="url(#bgGlow_robot1)"/>
<rect x="0" y="146" width="140" height="54" fill="url(#ov_robot1)"/>

<g transform="translate(0,4)" opacity="0.97">
<g transform="translate(0,4)">
  <!-- Antenna -->
  <line x1="70" y1="20" x2="70" y2="32" stroke="#334466" stroke-width="2"/>
  <circle cx="70" cy="20" r="3" fill="#ff3333" stroke="#aa1111" stroke-width="1"/>
  <circle cx="70" cy="20" r="6" fill="#ff3333" opacity="0.3"/>

  <!-- Head -->
  <rect x="46" y="32" width="48" height="44" rx="6" fill="url(#headGrad)" stroke="#334466" stroke-width="2"/>
  <!-- Face panel -->
  <rect x="50" y="36" width="40" height="36" rx="4" fill="#1a2030" stroke="#000" stroke-width="1"/>
  <!-- Eyes (glowing cyan) -->
  <rect x="56" y="46" width="10" height="8" rx="1.5" fill="#22ddff" stroke="#1188aa" stroke-width="0.5"/>
  <rect x="74" y="46" width="10" height="8" rx="1.5" fill="#22ddff" stroke="#1188aa" stroke-width="0.5"/>
  <!-- Eye glow -->
  <rect x="56" y="46" width="10" height="8" rx="1.5" fill="#22ddff" opacity="0.4"/>
  <rect x="74" y="46" width="10" height="8" rx="1.5" fill="#22ddff" opacity="0.4"/>
  <!-- Mouth (speaker grille) -->
  <line x1="58" y1="62" x2="82" y2="62" stroke="#22ddff" stroke-width="1"/>
  <line x1="58" y1="65" x2="82" y2="65" stroke="#22ddff" stroke-width="1"/>
  <line x1="58" y1="68" x2="82" y2="68" stroke="#22ddff" stroke-width="1"/>

  <!-- Side bolts -->
  <circle cx="46" cy="50" r="2" fill="#334466" stroke="#000" stroke-width="0.5"/>
  <circle cx="46" cy="58" r="2" fill="#334466" stroke="#000" stroke-width="0.5"/>
  <circle cx="94" cy="50" r="2" fill="#334466" stroke="#000" stroke-width="0.5"/>
  <circle cx="94" cy="58" r="2" fill="#334466" stroke="#000" stroke-width="0.5"/>

  <!-- Neck -->
  <rect x="60" y="76" width="20" height="6" fill="#334466" stroke="#000" stroke-width="1"/>
  <rect x="64" y="82" width="12" height="4" fill="#1a2030" stroke="#000" stroke-width="0.5"/>

  <!-- Body -->
  <path d="M44 86 L42 130 L98 130 L96 86 Q70 92 44 86 Z" fill="url(#metalGrad)" stroke="#334466" stroke-width="2"/>
  <!-- Chest panel -->
  <rect x="56" y="94" width="28" height="22" rx="2" fill="#1a2030" stroke="#000" stroke-width="1"/>
  <!-- Power core -->
  <circle cx="70" cy="105" r="5" fill="#22ff66" stroke="#118844" stroke-width="1"/>
  <circle cx="70" cy="105" r="8" fill="#22ff66" opacity="0.35"/>
  <!-- Side buttons -->
  <rect x="48" y="100" width="6" height="4" rx="1" fill="#ff3333" stroke="#aa1111" stroke-width="0.5"/>
  <rect x="48" y="108" width="6" height="4" rx="1" fill="#ffcc00" stroke="#aa7700" stroke-width="0.5"/>
  <rect x="86" y="100" width="6" height="4" rx="1" fill="#22ddff" stroke="#1188aa" stroke-width="0.5"/>
  <rect x="86" y="108" width="6" height="4" rx="1" fill="#ff6633" stroke="#aa3311" stroke-width="0.5"/>

  <!-- Arms -->
  <rect x="36" y="88" width="8" height="38" rx="3" fill="url(#metalGrad)" stroke="#334466" stroke-width="1.5"/>
  <rect x="96" y="88" width="8" height="38" rx="3" fill="url(#metalGrad)" stroke="#334466" stroke-width="1.5"/>
  <!-- Hands -->
  <rect x="32" y="124" width="16" height="10" rx="2" fill="#334466" stroke="#000" stroke-width="1"/>
  <rect x="92" y="124" width="16" height="10" rx="2" fill="#334466" stroke="#000" stroke-width="1"/>
  <!-- Fingers -->
  <line x1="36" y1="130" x2="36" y2="134" stroke="#000" stroke-width="1"/>
  <line x1="40" y1="130" x2="40" y2="134" stroke="#000" stroke-width="1"/>
  <line x1="44" y1="130" x2="44" y2="134" stroke="#000" stroke-width="1"/>
  <line x1="96" y1="130" x2="96" y2="134" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="130" x2="100" y2="134" stroke="#000" stroke-width="1"/>
  <line x1="104" y1="130" x2="104" y2="134" stroke="#000" stroke-width="1"/>
</g></g>

<text x="70" y="180" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="14" font-weight="900" fill="#334466" letter-spacing="1.5">ROBOT</text>
</svg>