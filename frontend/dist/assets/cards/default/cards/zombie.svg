<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
<defs>
  <linearGradient id="bg_zombie1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdfdfd"/><stop offset="100%" stop-color="#dde8d8"/></linearGradient>
  <linearGradient id="ov_zombie1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="black" stop-opacity="0"/><stop offset="100%" stop-color="black" stop-opacity="0.18"/></linearGradient>
  <linearGradient id="skinZombie" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9aae80"/>
    <stop offset="100%" stop-color="#6a8055"/>
  </linearGradient>
  <filter id="sd_zombie1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.4"/></filter>
  <radialGradient id="bgGlow_zombie1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#557744" stop-opacity="0.22"/><stop offset="60%" stop-color="#557744" stop-opacity="0.06"/><stop offset="100%" stop-color="#557744" stop-opacity="0"/></radialGradient>
</defs>
<g filter="url(#sd_zombie1)"><rect width="140" height="200" rx="14" fill="url(#bg_zombie1)"/></g>
<rect x="1.5" y="1.5" width="137" height="197" rx="13" fill="none" stroke="#3a4a2a" stroke-width="0.8" opacity="0.22"/>
<rect width="140" height="200" rx="14" fill="url(#bgGlow_zombie1)"/>
<rect x="0" y="146" width="140" height="54" fill="url(#ov_zombie1)"/>

<!-- Torn paper bits -->
<g opacity="0.18" fill="#3a4a2a">
  <path d="M14 50 L24 48 L20 56 L14 58 Z"/>
  <path d="M124 56 L132 60 L126 68 L120 64 Z"/>
  <path d="M16 100 L22 102 L18 110 Z"/>
  <path d="M120 110 L130 108 L126 116 Z"/>
</g>

<g transform="translate(0,4)" opacity="0.97">
<g transform="translate(0,4)">
  <!-- Head -->
  <ellipse cx="70" cy="70" rx="30" ry="32" fill="url(#skinZombie)" stroke="#3a4a2a" stroke-width="2"/>
  <!-- Bald patches -->
  <ellipse cx="58" cy="44" rx="6" ry="3" fill="#3a4a2a" opacity="0.5"/>
  <ellipse cx="80" cy="46" rx="5" ry="2.5" fill="#3a4a2a" opacity="0.5"/>
  <!-- Stitches on forehead -->
  <path d="M56 54 L62 56 L68 54 L74 56 L80 54" stroke="#1a1a1a" stroke-width="1.2" fill="none"/>
  <!-- Sunken eyes -->
  <ellipse cx="58" cy="64" rx="6" ry="5" fill="#2a1a2a" stroke="#1a1a1a" stroke-width="1"/>
  <ellipse cx="82" cy="64" rx="6" ry="5" fill="#2a1a2a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Glowing zombie eyes -->
  <circle cx="58" cy="65" r="2.5" fill="#aaee22"/>
  <circle cx="82" cy="65" r="2.5" fill="#aaee22"/>
  <circle cx="58" cy="65" r="4" fill="#aaee22" opacity="0.35"/>
  <circle cx="82" cy="65" r="4" fill="#aaee22" opacity="0.35"/>
  <!-- Nose (hole) -->
  <ellipse cx="70" cy="78" rx="3" ry="2" fill="#2a1a2a"/>
  <!-- Mouth (gap with teeth) -->
  <path d="M54 90 Q70 96 86 90 L86 94 Q70 100 54 94 Z" fill="#2a1a2a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Teeth (few broken) -->
  <rect x="58" y="90" width="3" height="5" fill="#f4e8c8" stroke="#886644" stroke-width="0.4"/>
  <rect x="64" y="91" width="3" height="6" fill="#f4e8c8" stroke="#886644" stroke-width="0.4"/>
  <rect x="70" y="92" width="3" height="5" fill="#f4e8c8" stroke="#886644" stroke-width="0.4"/>
  <rect x="76" y="91" width="3" height="6" fill="#f4e8c8" stroke="#886644" stroke-width="0.4"/>
  <!-- Drool -->
  <path d="M70 100 Q69 108 71 112 Q72 116 70 118" stroke="#88aa66" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Body (torn shirt) -->
  <path d="M40 102 L38 132 L102 132 L100 102 Q70 108 40 102 Z" fill="#5a4a3a" stroke="#2a1a1a" stroke-width="2"/>
  <!-- Shirt tears -->
  <path d="M44 104 L42 110 L48 108 Z" fill="#fdfdfd"/>
  <path d="M92 110 L96 116 L88 118 Z" fill="#fdfdfd"/>
  <path d="M58 122 L54 128 L60 128 Z" fill="#fdfdfd"/>
  <path d="M82 124 L86 130 L80 130 Z" fill="#fdfdfd"/>
  <!-- Exposed ribs -->
  <path d="M52 118 Q70 124 88 118" stroke="#9aae80" stroke-width="1.5" fill="none"/>
  <path d="M52 122 Q70 128 88 122" stroke="#9aae80" stroke-width="1.5" fill="none"/>
  <!-- Dark stain -->
  <ellipse cx="62" cy="124" rx="6" ry="3" fill="#aa3333" opacity="0.5"/>

  <!-- Arms (decaying) -->
  <path d="M40 104 L28 130 L36 134 L46 110 Z" fill="url(#skinZombie)" stroke="#3a4a2a" stroke-width="1.5"/>
  <path d="M100 104 L112 130 L104 134 L94 110 Z" fill="url(#skinZombie)" stroke="#3a4a2a" stroke-width="1.5"/>
  <!-- Torn arm tips -->
  <circle cx="32" cy="132" r="5" fill="url(#skinZombie)" stroke="#3a4a2a" stroke-width="1"/>
  <circle cx="108" cy="132" r="5" fill="url(#skinZombie)" stroke="#3a4a2a" stroke-width="1"/>
</g></g>

<text x="70" y="180" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="13" font-weight="900" fill="#3a4a2a" letter-spacing="1.5">ZOMBIE</text>
</svg>