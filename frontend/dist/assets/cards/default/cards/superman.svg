<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
<defs>
  <linearGradient id="bg_super1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fdfdfd"/><stop offset="100%" stop-color="#dce8ff"/></linearGradient>
  <linearGradient id="ov_super1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="black" stop-opacity="0"/><stop offset="100%" stop-color="black" stop-opacity="0.18"/></linearGradient>
  <linearGradient id="emblemGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffe066"/>
    <stop offset="100%" stop-color="#cc9900"/>
  </linearGradient>
  <filter id="sd_super1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.4"/></filter>
  <radialGradient id="bgGlow_super1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#3366cc" stop-opacity="0.22"/><stop offset="60%" stop-color="#3366cc" stop-opacity="0.06"/><stop offset="100%" stop-color="#3366cc" stop-opacity="0"/></radialGradient>
</defs>
<g filter="url(#sd_super1)"><rect width="140" height="200" rx="14" fill="url(#bg_super1)"/></g>
<rect x="1.5" y="1.5" width="137" height="197" rx="13" fill="none" stroke="#1a3a8a" stroke-width="0.8" opacity="0.22"/>
<rect width="140" height="200" rx="14" fill="url(#bgGlow_super1)"/>
<rect x="0" y="146" width="140" height="54" fill="url(#ov_super1)"/>

<g transform="translate(0,4)" opacity="0.97">
<g transform="translate(0,4)">
  <!-- Cape behind shoulders -->
  <path d="M44 84 L34 132 L52 126 Z" fill="#cc2233" stroke="#881122" stroke-width="1.5"/>
  <path d="M96 84 L106 132 L88 126 Z" fill="#cc2233" stroke="#881122" stroke-width="1.5"/>

  <!-- Head (sits directly on body, no neck gap) -->
  <ellipse cx="70" cy="56" rx="24" ry="26" fill="#a8b8d8" stroke="#334466" stroke-width="2.2"/>
  <!-- Jaw shadow blends into body -->
  <path d="M50 78 Q70 88 90 78 L90 84 L50 84 Z" fill="#7a8aa8" opacity="0.7"/>
  <!-- Hair -->
  <path d="M46 46 Q48 28 70 26 Q92 28 94 46" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <!-- Mask -->
  <path d="M48 54 L48 60 Q70 66 92 60 L92 54" fill="#3366cc" stroke="#1a3a8a" stroke-width="1"/>
  <!-- Eyes -->
  <ellipse cx="60" cy="57" rx="4" ry="3" fill="white" stroke="#1a3a8a" stroke-width="0.6"/>
  <ellipse cx="80" cy="57" rx="4" ry="3" fill="white" stroke="#1a3a8a" stroke-width="0.6"/>
  <circle cx="60" cy="57" r="2" fill="#0a0a1e"/>
  <circle cx="80" cy="57" r="2" fill="#0a0a1e"/>

  <!-- Body (suit) - starts at y=80, head bottom rests on it -->
  <path d="M48 80 L46 132 L94 132 L92 80 Q70 86 48 80 Z" fill="#2244aa" stroke="#1a3a8a" stroke-width="2"/>

  <!-- Arms (from shoulders y=82) -->
  <path d="M48 82 L38 124 L46 126 L52 86 Z" fill="#2244aa" stroke="#1a3a8a" stroke-width="1.5"/>
  <path d="M92 82 L102 124 L94 126 L88 86 Z" fill="#2244aa" stroke="#1a3a8a" stroke-width="1.5"/>
  <!-- Fists -->
  <circle cx="42" cy="126" r="5" fill="#a8b8d8" stroke="#334466" stroke-width="1.5"/>
  <circle cx="98" cy="126" r="5" fill="#a8b8d8" stroke="#334466" stroke-width="1.5"/>

  <!-- Chest emblem on top of body -->
  <g transform="translate(70,104)">
    <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#emblemGrad)" stroke="#aa7700" stroke-width="1.5"/>
    <polygon points="0,-8 8,0 0,8 -8,0" fill="none" stroke="#fff7c2" stroke-width="0.6" opacity="0.6"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" fill="#1a3a8a" font-weight="900">S</text>
  </g>

  <!-- Belt -->
  <rect x="48" y="120" width="44" height="5" fill="#ffcc00" stroke="#aa7700" stroke-width="1"/>
  <rect x="66" y="119" width="8" height="7" rx="1" fill="#aa7700" stroke="#664400" stroke-width="0.6"/>
</g></g>

<text x="70" y="180" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="12" font-weight="900" fill="#1a3a8a" letter-spacing="1.5">SIÊU NHÂN</text>
</svg>