<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d1f" />
  <title>Arcana — Phòng chờ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/global.css" />
  <link rel="stylesheet" href="/shared/styles/settings.css" />
  <link rel="stylesheet" href="/pages/styles/lobby.css" />
</head>
<body>
  <main class="lobby-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="stars" aria-hidden="true"></div>

    <!-- Floating tarot cards -->
    <div class="cards-scene" aria-hidden="true">
      <article class="floating-card card-sun"><span class="card-glyph">☼</span><span class="card-title">SOL</span></article>
      <article class="floating-card card-moon"><span class="card-glyph">☾</span><span class="card-title">LUNA</span></article>
      <article class="floating-card card-eye"><span class="card-glyph">◉</span><span class="card-title">ORACLE</span></article>
      <article class="floating-card card-star"><span class="card-glyph">✦</span><span class="card-title">ASTRA</span></article>
    </div>

    <!-- Top: back link + settings -->
    <a class="back-link" href="/pages/landing/index.html"><span>←</span> Quay lại</a>
    <button class="settings-button" id="settings-button" type="button" aria-label="Cài đặt">⚙</button>

    <header class="lobby-header">
      <p class="eyebrow">PHÒNG CHỜ</p>
      <h1 id="lobby-title">Đang triệu hồi đồng đội...</h1>

      <div class="invite-card">
        <p class="invite-label">Mã mời phòng</p>
        <div class="invite-code-row">
          <button class="code-visibility" id="code-visibility" type="button" aria-pressed="true" aria-label="Ẩn/hiện mã phòng">
            <span class="eye-icon" data-state="visible" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="eye-open" width="20" height="20">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
              </svg>
              <svg viewBox="0 0 24 24" class="eye-closed" width="20" height="20">
                <path d="M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M2 12s3.5-7 10-7c2.4 0 4.4.9 6 1.9M22 12s-3.5 7-10 7c-2.4 0-4.4-.9-6-1.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          <span class="invite-code" id="invite-code">------</span>
          <button class="copy-button" id="copy-button" type="button">
            <span class="copy-button__label">Sao chép</span>
            <span class="copy-button__check" aria-hidden="true">✓</span>
          </button>
        </div>
        <p class="invite-hint">Chia sẻ mã này cho 7 người bạn muốn mời vào cùng phòng.</p>
      </div>
    </header>

    <!-- Middle: seats + deck area + seats -->
    <section class="lobby-arena">
      <div class="seats seats-left" id="seats-left"></div>

      <!-- NEW DECK ANIMATION AREA -->
      <div class="deck-area">
        <button class="deck-arrow deck-arrow-prev" id="game-prev" type="button" aria-label="Game trước">‹</button>

        <div class="deck-stage" id="deck-stage">
          <!-- The deck pile (visible at rest) -->
          <div class="deck-pile idle" id="deck-pile">
            <!-- Layered cards for deck effect -->
            <div class="pile-card" style="transform: translate(-8px, -6px) rotate(-4deg); opacity: 0.6;"></div>
            <div class="pile-card" style="transform: translate(-4px, -3px) rotate(-2deg); opacity: 0.8;"></div>
            <div class="pile-card" style="transform: translate(0, 0) rotate(0deg); opacity: 1;"></div>
          </div>

          <!-- Flying cards container (hidden initially) -->
          <div class="flying-cards-container" id="flying-cards" style="display: none;">
            <!-- Card 1 -->
            <div class="flying-card" data-index="0">
              <div class="card-face card-back-face">
                <div class="card-back">
                  <div class="card-back-pattern" id="pattern-0"></div>
                  <div class="card-back-text">
                    <div class="line1">cái gì đây</div>
                    <div class="line2">???</div>
                  </div>
                </div>
              </div>
              <div class="card-face card-front-face">
                <img src="" alt="Card" class="card-img" />
              </div>
            </div>
            <!-- Card 2 -->
            <div class="flying-card" data-index="1">
              <div class="card-face card-back-face">
                <div class="card-back">
                  <div class="card-back-pattern" id="pattern-1"></div>
                  <div class="card-back-text">
                    <div class="line1">cái gì đây</div>
                    <div class="line2">???</div>
                  </div>
                </div>
              </div>
              <div class="card-face card-front-face">
                <img src="" alt="Card" class="card-img" />
              </div>
            </div>
            <!-- Card 3 -->
            <div class="flying-card" data-index="2">
              <div class="card-face card-back-face">
                <div class="card-back">
                  <div class="card-back-pattern" id="pattern-2"></div>
                  <div class="card-back-text">
                    <div class="line1">cái gì đây</div>
                    <div class="line2">???</div>
                  </div>
                </div>
              </div>
              <div class="card-face card-front-face">
                <img src="" alt="Card" class="card-img" />
              </div>
            </div>
            <!-- Card 4 -->
            <div class="flying-card" data-index="3">
              <div class="card-face card-back-face">
                <div class="card-back">
                  <div class="card-back-pattern" id="pattern-3"></div>
                  <div class="card-back-text">
                    <div class="line1">cái gì đây</div>
                    <div class="line2">???</div>
                  </div>
                </div>
              </div>
              <div class="card-face card-front-face">
                <img src="" alt="Card" class="card-img" />
              </div>
            </div>
          </div>
        </div>

        <button class="deck-arrow deck-arrow-next" id="game-next" type="button" aria-label="Game tiếp theo">›</button>

        <p class="deck-label" id="deck-label">EXPLODING CATS</p>
        <p class="deck-subtitle" id="deck-subtitle">Đặt bài, rút bài, đừng để con mèo nổ!</p>
      </div>

      <div class="seats seats-right" id="seats-right"></div>
    </section>

    <footer class="lobby-footer">
      <span class="status-text" id="status-text">Đang tải phòng...</span>
      <button class="action-button primary" id="start-button" type="button" disabled>Bắt đầu ván đấu <span>⚔</span></button>
    </footer>

    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>

    <div id="settings-mount"></div>
  </main>

  <script type="module" src="./entry.js"></script>
</body>
</html>
