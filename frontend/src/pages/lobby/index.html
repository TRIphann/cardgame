<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Arcana — Phòng chờ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/global.css" />
  <link rel="stylesheet" href="/pages/styles/lobby.css" />
</head>
<body class="lobby-page-body">
  <div class="lobby-stage">

    <!-- Background layers: gradient mesh, drifting cats silhouettes, particles, scanlines -->
    <div class="lobby-bg">
      <div class="bg-mesh" aria-hidden="true"></div>
      <div class="bg-aurora" aria-hidden="true">
        <span class="aurora aurora-1"></span>
        <span class="aurora aurora-2"></span>
        <span class="aurora aurora-3"></span>
      </div>
      <div class="bg-cats" aria-hidden="true">
        <span class="cat-silhouette cat-1">🐱</span>
        <span class="cat-silhouette cat-2">😺</span>
        <span class="cat-silhouette cat-3">😼</span>
        <span class="cat-silhouette cat-4">😻</span>
        <span class="cat-silhouette cat-5">🙀</span>
      </div>
      <canvas class="bg-particles" aria-hidden="true"></canvas>
      <div class="bg-scanlines" aria-hidden="true"></div>
      <div class="bg-vignette" aria-hidden="true"></div>
    </div>

    <!-- Top corner controls -->
    <button class="lobby-corner-btn lobby-btn-exit" id="leave-button" type="button" aria-label="Rời phòng">
      <span class="btn-glyph">⤺</span>
      <span class="btn-text" data-i18n="lobby.leave">Rời phòng</span>
    </button>

    <button class="lobby-corner-btn lobby-btn-settings" id="settings-button" type="button" aria-label="Cài đặt">
      <span class="btn-glyph">⚙</span>
    </button>

    <!-- Top: invite code -->
    <section class="invite-banner" aria-labelledby="invite-code-label">
      <p class="invite-eyebrow" data-i18n="lobby.inviteCode">MÃ MỜI PHÒNG</p>
      <div class="invite-code-row">
        <span class="invite-code" id="invite-code">------</span>
        <button class="invite-copy" id="copy-button" type="button" data-i18n="lobby.copy">Sao chép</button>
      </div>
      <p class="invite-hint" data-i18n="lobby.shareHint">Chia sẻ mã này cho tối đa 7 người bạn.</p>
    </section>

    <!-- Middle: player seats (4 left, 4 right) + deck center -->
    <section class="lobby-arena">
      <div class="seats seats-left" id="seats-left"></div>

      <div class="deck-area" aria-hidden="false">
        <p class="deck-label">EXPLODING CATS</p>
        <div class="deck-stack">
          <div class="deck-card deck-card-back card-1"></div>
          <div class="deck-card deck-card-back card-2"></div>
          <div class="deck-card deck-card-back card-3"></div>
          <div class="deck-card deck-card-back card-4"></div>
          <div class="deck-card deck-card-front">
            <span class="deck-card-glyph">🐱</span>
            <span class="deck-card-explosion">💥</span>
          </div>
        </div>
        <div class="deck-glow"></div>
      </div>

      <div class="seats seats-right" id="seats-right"></div>
    </section>

    <!-- Bottom: status + start -->
    <footer class="lobby-footer">
      <span class="status-text" id="status-text">Đang tải phòng…</span>
      <button class="lobby-start-btn" id="start-button" type="button" disabled>
        <span data-i18n="lobby.startGame">Bắt đầu</span>
        <span class="start-glyph">⚔</span>
      </button>
    </footer>

    <!-- Settings modal mount -->
    <div id="settings-mount"></div>

    <!-- Toast layer -->
    <div class="lobby-toast" id="toast" hidden></div>
  </div>

  <script type="module" src="./entry.js"></script>
</body>
</html>
