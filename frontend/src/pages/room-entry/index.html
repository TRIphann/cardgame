<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Arcana — Mèo Nổ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/global.css" />
  <link rel="stylesheet" href="/pages/styles/room-entry.css" />
</head>
<body class="entry-body">
  <div class="entry-stage">
    <div class="entry-bg">
      <div class="bg-mesh" aria-hidden="true"></div>
      <div class="bg-aurora" aria-hidden="true">
        <span class="aurora aurora-1"></span>
        <span class="aurora aurora-2"></span>
      </div>
    </div>

    <a class="back-link" href="../landing/index.html">
      <span>←</span> Quay lại
    </a>

    <section class="entry-panel">
      <p class="eyebrow">MÈO NỔ</p>
      <h1 class="entry-title">Vào đấu trường</h1>
      <p class="entry-tagline">Đặt bài, rút bài — đừng để con mèo nổ tung!</p>

      <form class="entry-form" id="player-form">
        <label for="player-name" data-i18n="landing.playerName">Tên người chơi</label>
        <div class="input-wrap">
          <span class="input-icon">🐱</span>
          <input id="player-name" type="text" maxlength="24" autocomplete="nickname" required placeholder="Nhập tên của bạn..." />
        </div>

        <div class="action-row">
          <button type="button" class="action-btn primary" data-action="create">
            <span data-i18n="landing.createRoom">Tạo phòng</span>
            <span>↗</span>
          </button>
          <button type="button" class="action-btn secondary" data-action="join">
            <span data-i18n="landing.joinRoom">Vào phòng</span>
            <span>→</span>
          </button>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="./entry.js"></script>
</body>
</html>
