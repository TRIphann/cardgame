<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d1f" />
  <title>Arcana — Card Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/global.css" />
  <link rel="stylesheet" href="/pages/styles/landing.css" />
</head>
<body>
  <main class="landing-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="stars" aria-hidden="true"></div>

    <div class="cards-scene" aria-hidden="true">
      <article class="floating-card card-sun"><span class="card-glyph">☼</span><span class="card-title">SOL</span></article>
      <article class="floating-card card-moon"><span class="card-glyph">☾</span><span class="card-title">LUNA</span></article>
      <article class="floating-card card-eye"><span class="card-glyph">◉</span><span class="card-title">ORACLE</span></article>
      <article class="floating-card card-star"><span class="card-glyph">✦</span><span class="card-title">ASTRA</span></article>
      <article class="floating-card card-flame"><span class="card-glyph">♠</span><span class="card-title">IGNIS</span></article>
    </div>

    <section class="welcome-panel" aria-labelledby="game-title">
      <div class="brand-mark"><span></span><b>✦</b><span></span></div>
      <p class="eyebrow">THE MYSTIC CARD ARENA</p>
      <h1 id="game-title">ARCANA</h1>
      <p class="tagline">Số phận nằm trong tay bạn.</p>

      <div class="divider"><i></i><span>✧</span><i></i></div>

      <!-- Inline onsubmit = hard guarantee the form NEVER reloads the page,
           even if entry.js fails to load for any reason. -->
      <form class="player-form" id="player-form" novalidate onsubmit="event.preventDefault(); return false;">
        <label for="player-name">Tên người chơi</label>
        <div class="name-input-wrap">
          <span class="input-icon">♙</span>
          <input id="player-name" name="playerName" type="text" maxlength="24" autocomplete="nickname" placeholder="Nhập tên của bạn..." required />
        </div>
        <p class="hint">Tên của bạn sẽ được hiển thị trong đấu trường</p>

        <!-- Step 1: primary CTA — opens the room code + create/join buttons -->
        <button class="action-button primary enter-button" id="enter-button" type="button">
          Vào đấu trường <span>→</span>
        </button>

        <!-- Step 2: revealed after the player commits to a name -->
        <div class="room-actions" id="room-actions" hidden>
          <label for="room-code">Mã phòng</label>
          <div class="name-input-wrap">
            <span class="input-icon">✦</span>
            <input id="room-code" name="roomCode" type="text" maxlength="6" autocomplete="off" placeholder="Nhập mã 6 ký tự (bỏ trống nếu muốn tạo mới)" />
          </div>
          <div class="action-row">
            <button class="action-button primary" type="button" id="create-button" data-action="create">
              Tạo phòng <span>↗</span>
            </button>
            <button class="action-button secondary" type="button" id="join-button" data-action="join">
              Vào phòng <span>→</span>
            </button>
          </div>
        </div>

        <p class="form-message" id="form-message" hidden></p>

        <!-- Spinner shown while waiting for the backend (Render cold-start can take ~30s) -->
        <div class="loading" id="loading" hidden>
          <span class="loading-spinner" aria-hidden="true"></span>
          <span id="loading-text">Đang kết nối máy chủ...</span>
        </div>
      </form>

      <p class="footer-note"><span class="status-dot"></span> Sẵn sàng cho một ván đấu huyền bí?</p>
    </section>

    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
  </main>

  <script>
    // Boot diagnostics — surfaces module-load errors even with console closed.
    window.__arcanaBootError = null;
    window.addEventListener("error", (e) => {
      window.__arcanaBootError = (e.error?.message) || e.message || "unknown";
      console.error("[arcana] boot error:", e.error || e.message);
    });
    window.addEventListener("unhandledrejection", (e) => {
      window.__arcanaBootError = (e.reason?.message) || String(e.reason);
      console.error("[arcana] unhandled rejection:", e.reason);
    });
    console.log("[arcana] landing: html parsed");
  </script>
  <script type="module" src="./entry.js" defer></script>
</body>
</html>
