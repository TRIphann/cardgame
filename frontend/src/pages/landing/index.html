<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d1f" />
  <title>Arcana — Card Battle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/global.css" />
  <link rel="stylesheet" href="/pages/styles/landing.css" />
</head>
<body>
  <main class="landing-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="stars" aria-hidden="true"></div>

    <div class="cards-scene" aria-hidden="true">
      <article class="floating-card card-sun"><span class="card-glyph">☼</span><span class="card-title">SOL</span></article>
      <article class="floating-card card-moon"><span class="card-glyph">☾</span><span class="card-title">LUNA</span></article>
      <article class="floating-card card-eye"><span class="card-glyph">◉</span><span class="card-title">ORACLE</span></article>
      <article class="floating-card card-star"><span class="card-glyph">✦</span><span class="card-title">ASTRA</span></article>
      <article class="floating-card card-flame"><span class="card-glyph">♠</span><span class="card-title">IGNIS</span></article>
    </div>

    <section class="welcome-panel" aria-labelledby="game-title">
      <div class="brand-mark"><span></span><b>✦</b><span></span></div>
      <p class="eyebrow">THE MYSTIC CARD ARENA</p>
      <h1 id="game-title">ARCANA</h1>
      <p class="tagline">Số phận nằm trong tay bạn.</p>

      <div class="divider"><i></i><span>✧</span><i></i></div>

      <form class="player-form" id="player-form">
        <label for="player-name">Tên người chơi</label>
        <div class="name-input-wrap">
          <span class="input-icon">♙</span>
          <input id="player-name" name="playerName" type="text" maxlength="24" autocomplete="nickname" placeholder="Nhập tên của bạn..." required />
        </div>
        <p class="hint">Tên của bạn sẽ được hiển thị trong đấu trường</p>
        <div class="action-row">
          <button class="action-button primary" type="button" data-action="create">Tạo phòng <span>↗</span></button>
          <button class="action-button secondary" type="button" data-action="join">Vào phòng <span>→</span></button>
        </div>
        <p class="form-message" id="form-message" hidden></p>
      </form>

      <p class="footer-note"><span class="status-dot"></span> Sẵn sàng cho một ván đấu huyền bí?</p>
    </section>

    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
  </main>

  <script type="module" src="./entry.js"></script>
</body>
</html>
