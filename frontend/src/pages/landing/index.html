<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Arcana — Lobby Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/global.css" />
  <link rel="stylesheet" href="/pages/styles/landing.css" />
</head>
<body class="landing-page-body">
  <div class="landing-stage">

    <div class="landing-bg">
      <div class="bg-mesh" aria-hidden="true"></div>
      <div class="bg-aurora" aria-hidden="true">
        <span class="aurora aurora-1"></span>
        <span class="aurora aurora-2"></span>
      </div>
      <div class="bg-vignette" aria-hidden="true"></div>
    </div>

    <header class="landing-brand">
      <p class="eyebrow" data-i18n="landing.eyebrow">ĐẤU TRƯỜNG THẺ HUYỀN BÍ</p>
      <h1 data-i18n="landing.title">Arcana</h1>
      <p class="tagline" data-i18n="landing.tagline">Số phận nằm trong tay bạn.</p>
    </header>

    <main class="landing-main">
      <p class="section-label" data-i18n="landing.pickGame">CHỌN TRÒ CHƠI</p>

      <div class="game-grid">
        <article class="game-card" data-game="exploding-cats">
          <div class="game-card-art">
            <span class="art-glyph">🐱</span>
            <span class="art-explosion">💥</span>
          </div>
          <div class="game-card-body">
            <h2 class="game-card-title" data-i18n="landing.game.explodingCats">Mèo Nổ</h2>
            <p class="game-card-desc">Đặt bài, rút bài, đừng để con mèo nổ!</p>
          </div>
          <div class="game-card-cta">
            <span>Chơi ngay</span>
            <span class="cta-arrow">→</span>
          </div>
        </article>

        <article class="game-card is-locked">
          <div class="game-card-art">
            <span class="art-glyph">🃏</span>
          </div>
          <div class="game-card-body">
            <h2 class="game-card-title" data-i18n="landing.game.comingSoon">Sắp ra mắt</h2>
            <p class="game-card-desc">Trò chơi tiếp theo đang được phát triển.</p>
          </div>
          <div class="game-card-cta"><span>Soon</span></div>
        </article>
      </div>

      <p class="landing-footer" data-i18n="landing.footer">Sẵn sàng cho một ván đấu huyền bí?</p>
    </main>

    <div id="settings-mount"></div>
  </div>

  <script type="module" src="./entry.js"></script>
</body>
</html>
