<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d1f" />
  <title>Arcana — Đấu trường</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/pages/room.css" />
</head>
<body>
  <main class="room-page">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <section class="room-panel">
      <a class="back-link" href="../lobby/index.html"><span>←</span> Về phòng chờ</a>

      <header class="room-header">
        <p class="eyebrow">ĐẤU TRƯỜNG</p>
        <h1>Arcana Arena</h1>
        <p class="room-meta" id="room-meta">Phòng <span id="meta-code">------</span> · Chủ phòng <span id="meta-host">—</span></p>
      </header>

      <div class="room-body">
        <article class="seat-card">
          <div class="seat-glyph">♛</div>
          <p class="seat-label">Bạn</p>
          <p class="seat-name" id="me-name">—</p>
          <p class="seat-tag" id="me-tag">Đang vào phòng...</p>
        </article>

        <article class="seat-card alt">
          <div class="seat-glyph">⚔</div>
          <p class="seat-label">Vòng tiếp theo</p>
          <p class="seat-name">Đang phát triển</p>
          <p class="seat-tag">Tính năng trận đấu sẽ được bổ sung</p>
        </article>
      </div>

      <footer class="room-footer">
        <button class="action-button secondary" id="leave-button" type="button">Rời phòng</button>
      </footer>
    </section>

    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
  </main>
  <script type="module" src="../../scripts/pages/room.js"></script>
</body>
</html>
