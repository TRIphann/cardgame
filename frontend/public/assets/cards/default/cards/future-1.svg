<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
<defs>
  <linearGradient id="bg_future1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a1a3e"/><stop offset="100%" stop-color="#1a0a28"/></linearGradient>
  <linearGradient id="ov_future1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="black" stop-opacity="0"/><stop offset="100%" stop-color="black" stop-opacity="0.42"/></linearGradient>
  <radialGradient id="bgGlow_future1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#ff66aa" stop-opacity="0.18"/><stop offset="60%" stop-color="#ff66aa" stop-opacity="0.05"/><stop offset="100%" stop-color="#ff66aa" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff88cc" stop-opacity="0.4"/>
    <stop offset="60%" stop-color="#aa3377" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#220044" stop-opacity="0.9"/>
  </radialGradient>
  <linearGradient id="standGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3d0066"/>
    <stop offset="100%" stop-color="#1a0022"/>
  </linearGradient>
  <filter id="sd_future1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.6"/></filter>
</defs>
<g filter="url(#sd_future1)"><rect width="140" height="200" rx="14" fill="url(#bg_future1)"/></g>
<rect width="140" height="200" rx="14" fill="url(#bgGlow_future1)"/>
<rect x="1.5" y="1.5" width="137" height="197" rx="13" fill="none" stroke="white" stroke-width="0.8" opacity="0.13"/>
<rect x="0" y="146" width="140" height="54" fill="url(#ov_future1)"/>

<!-- Decorative stars background -->
<circle cx="22" cy="40" r="1.5" fill="#ff66aa" opacity="0.6"/>
<circle cx="118" cy="48" r="1.2" fill="#ff88cc" opacity="0.5"/>
<circle cx="16" cy="100" r="1.3" fill="#ff88cc" opacity="0.5"/>
<circle cx="124" cy="108" r="1.4" fill="#ff66aa" opacity="0.5"/>
<circle cx="30" cy="130" r="1" fill="#ff88cc" opacity="0.4"/>
<circle cx="112" cy="135" r="1" fill="#ff66aa" opacity="0.4"/>

<!-- Crystal ball with hat on top -->
<g transform="translate(70,100)">
  <!-- Outer glow around orb -->
  <circle cx="0" cy="0" r="32" fill="#ff66aa" opacity="0.15"/>
  <!-- Main orb body -->
  <circle cx="0" cy="0" r="28" fill="url(#orbGrad)" stroke="#ff66aa" stroke-width="2.5"/>
  <!-- Inner ring -->
  <circle cx="0" cy="0" r="22" fill="none" stroke="#ff88cc" stroke-width="0.8" opacity="0.5"/>
  <!-- Inner glow -->
  <circle cx="0" cy="0" r="14" fill="none" stroke="#ff66aa" stroke-width="0.6" opacity="0.4"/>
  <!-- Highlight reflection (top-left) -->
  <ellipse cx="-10" cy="-12" rx="8" ry="5" fill="white" opacity="0.3" transform="rotate(-30 -10 -12)"/>
  <ellipse cx="-13" cy="-8" rx="3" ry="2" fill="white" opacity="0.4" transform="rotate(-30 -13 -8)"/>
  <!-- Center diamond symbol -->
  <text x="0" y="5" text-anchor="middle" font-family="serif" font-size="13" fill="#ff88cc" opacity="0.85">&#9670;</text>
</g>

<!-- Witch hat - sitting ON TOP of crystal ball -->
<g transform="translate(70,68)">
  <!-- Hat brim sits right at top of orb -->
  <ellipse cx="0" cy="6" rx="36" ry="5.5" fill="#1a0022" stroke="#ff66aa" stroke-width="2"/>
  <ellipse cx="0" cy="5" rx="36" ry="3" fill="#2a0033" opacity="0.6"/>
  <!-- Hat body (cone with curved tip) -->
  <path d="M-20 6 Q-20 -10 -8 -16 Q-3 -34 3 -38 Q11 -36 18 -16 Q24 -10 20 6 Z" fill="#1a0022" stroke="#ff66aa" stroke-width="2"/>
  <!-- Hat band -->
  <path d="M-19 2 Q0 6 19 2" stroke="#ff88cc" stroke-width="2.5" fill="none"/>
  <ellipse cx="0" cy="2" rx="19" ry="2.5" fill="#3d0066" stroke="#ff88cc" stroke-width="1"/>
  <!-- Hat tip bend -->
  <path d="M3 -38 Q12 -42 14 -34 Q14 -28 9 -30" fill="#1a0022" stroke="#ff66aa" stroke-width="2"/>
  <!-- Highlight -->
  <path d="M-10 -8 Q-3 -28 3 -34" stroke="white" stroke-width="1.8" fill="none" opacity="0.22"/>
  <!-- Sparkles -->
  <circle cx="-11" cy="-4" r="1.3" fill="#ff88cc" opacity="0.8"/>
  <circle cx="11" cy="0" r="1.1" fill="#ff66aa" opacity="0.7"/>
  <circle cx="6" cy="-18" r="1" fill="white" opacity="0.55"/>
  <text x="0" y="4" text-anchor="middle" font-family="serif" font-size="5" fill="#ffaaee" opacity="0.9">&#10038;</text>
</g>

<!-- Crystal ball stand -->
<g transform="translate(70,134)">
  <ellipse cx="0" cy="0" rx="22" ry="4" fill="url(#standGrad)" stroke="#ff66aa" stroke-width="1.8"/>
  <ellipse cx="0" cy="-1" rx="16" ry="2" fill="#3d0066" opacity="0.7"/>
  <ellipse cx="-6" cy="-1" rx="4" ry="1" fill="white" opacity="0.25"/>
</g>

<text x="70" y="183" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="13" font-weight="900" fill="white" letter-spacing="1.5">XEM 1 TÍ</text>
</svg>