<svg xmlns="http://www.w3.org/2000/svg" width="140" height="200" viewBox="0 0 140 200">
<defs>
  <linearGradient id="bg_back1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a0f3d"/><stop offset="100%" stop-color="#0a0420"/></linearGradient>
  <linearGradient id="ov_back1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="black" stop-opacity="0"/><stop offset="100%" stop-color="black" stop-opacity="0.42"/></linearGradient>
  <radialGradient id="bgGlow_back1" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#ddaaff" stop-opacity="0.22"/><stop offset="60%" stop-color="#ddaaff" stop-opacity="0.07"/><stop offset="100%" stop-color="#ddaaff" stop-opacity="0"/></radialGradient>
  <radialGradient id="emblemGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff88ee" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#aa44dd" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#3d0066" stop-opacity="0.4"/>
  </radialGradient>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff88ee"/>
    <stop offset="100%" stop-color="#7733aa"/>
  </linearGradient>
  <filter id="sd_back1"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="black" flood-opacity="0.6"/></filter>
</defs>

<g filter="url(#sd_back1)"><rect width="140" height="200" rx="14" fill="url(#bg_back1)"/></g>
<rect width="140" height="200" rx="14" fill="url(#bgGlow_back1)"/>
<rect x="1.5" y="1.5" width="137" height="197" rx="13" fill="none" stroke="white" stroke-width="0.8" opacity="0.13"/>
<rect x="0" y="146" width="140" height="54" fill="url(#ov_back1)"/>

<!-- Background sparkles -->
<circle cx="18" cy="28" r="1.2" fill="#ff88ee" opacity="0.55"/>
<circle cx="122" cy="34" r="1.1" fill="#ddaaff" opacity="0.5"/>
<circle cx="14" cy="92" r="1.3" fill="#ddaaff" opacity="0.5"/>
<circle cx="126" cy="100" r="1.2" fill="#ff88ee" opacity="0.55"/>
<circle cx="24" cy="132" r="1" fill="#ddaaff" opacity="0.45"/>
<circle cx="116" cy="138" r="1" fill="#ff88ee" opacity="0.45"/>
<circle cx="40" cy="18" r="0.8" fill="white" opacity="0.4"/>
<circle cx="100" cy="20" r="0.8" fill="white" opacity="0.4"/>
<circle cx="70" cy="10" r="0.9" fill="white" opacity="0.5"/>

<!-- Outer decorative frame -->
<rect x="10" y="10" width="120" height="180" rx="10" fill="none" stroke="#ddaaff" stroke-width="1.2" opacity="0.35"/>
<rect x="14" y="14" width="112" height="172" rx="8" fill="none" stroke="#ff88ee" stroke-width="0.5" opacity="0.25"/>

<!-- Corner ornaments -->
<g fill="#ff88ee" opacity="0.55">
  <circle cx="18" cy="18" r="2"/>
  <circle cx="122" cy="18" r="2"/>
  <circle cx="18" cy="182" r="2"/>
  <circle cx="122" cy="182" r="2"/>
</g>

<!-- Central emblem (circular medallion) -->
<g transform="translate(70,92)">
  <!-- Outer glow ring -->
  <circle cx="0" cy="0" r="38" fill="#ddaaff" opacity="0.12"/>
  <!-- Decorative outer ring -->
  <circle cx="0" cy="0" r="32" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="0" cy="0" r="28" fill="none" stroke="#ff88ee" stroke-width="0.8" opacity="0.5"/>
  <!-- Medallion body -->
  <circle cx="0" cy="0" r="24" fill="url(#emblemGrad)" stroke="#ff88ee" stroke-width="1.5"/>
  <!-- Inner detail ring -->
  <circle cx="0" cy="0" r="18" fill="none" stroke="#ffaaee" stroke-width="0.6" opacity="0.55"/>
  <!-- Highlight reflection -->
  <ellipse cx="-8" cy="-10" rx="6" ry="4" fill="white" opacity="0.28" transform="rotate(-30 -8 -10)"/>
  <ellipse cx="-11" cy="-6" rx="2.5" ry="1.6" fill="white" opacity="0.4" transform="rotate(-30 -11 -6)"/>

  <!-- Crown icon inside emblem -->
  <g transform="translate(0,-2)">
    <path d="M-12 2 L-9 -7 L-4 -2 L0 -10 L4 -2 L9 -7 L12 2 Z" fill="#ffe9b3" stroke="#aa7700" stroke-width="1"/>
    <circle cx="-9" cy="-7" r="1.2" fill="#ff4488"/>
    <circle cx="0" cy="-10" r="1.2" fill="#ff4488"/>
    <circle cx="9" cy="-7" r="1.2" fill="#ff4488"/>
    <rect x="-12" y="2" width="24" height="3" rx="1" fill="#aa7700"/>
  </g>
</g>

<!-- Decorative diamond dots around emblem -->
<g fill="#ff88ee" opacity="0.6">
  <circle cx="38" cy="60" r="1.4"/>
  <circle cx="102" cy="60" r="1.4"/>
  <circle cx="36" cy="124" r="1.4"/>
  <circle cx="104" cy="124" r="1.4"/>
</g>

<!-- Title at bottom -->
<text x="70" y="162" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="10" font-weight="900" fill="white" letter-spacing="1" opacity="0.95">ĐỪNG RÚT</text>
<text x="70" y="177" text-anchor="middle" font-family="'Arial Black','Segoe UI Black',sans-serif" font-size="10" font-weight="900" fill="#ff88ee" letter-spacing="1" opacity="0.95">LÁ NÀY!</text>
</svg>